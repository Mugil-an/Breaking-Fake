services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_SERVICE_URL: http://model:8001
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      model:
        condition: service_healthy
    restart: unless-stopped

  model:
    build:
      context: .
      dockerfile: model/Dockerfile
    environment:
      ENVIRONMENT: production
      USE_CPU: "true"
      CHECKPOINT_NAME: breaking_fake_model_best.pth
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
