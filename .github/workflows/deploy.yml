name: Deploy to Kubernetes

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push API image
      run: |
        docker build -t ${{ secrets.DOCKER_REGISTRY }}/breaking-fake-api:${{ github.sha }} .
        docker push ${{ secrets.DOCKER_REGISTRY }}/breaking-fake-api:${{ github.sha }}

    - name: Build and push Frontend image
      run: |
        docker build -t ${{ secrets.DOCKER_REGISTRY }}/breaking-fake-frontend:${{ github.sha }} ./frontend
        docker push ${{ secrets.DOCKER_REGISTRY }}/breaking-fake-frontend:${{ github.sha }}

    - name: Deploy to Kubernetes
      env:
        KUBECONFIG: ${{ secrets.KUBE_CONFIG }}
      run: |
        echo "$KUBECONFIG" > kubeconfig
        export KUBECONFIG=$(pwd)/kubeconfig
        kubectl set image deployment/breaking-fake-api api=${{ secrets.DOCKER_REGISTRY }}/breaking-fake-api:${{ github.sha }} -n breaking-fake || kubectl apply -f k8s/api-deployment.yaml -n breaking-fake
        kubectl set image deployment/breaking-fake-frontend frontend=${{ secrets.DOCKER_REGISTRY }}/breaking-fake-frontend:${{ github.sha }} -n breaking-fake || kubectl apply -f k8s/frontend-deployment.yaml -n breaking-fake
